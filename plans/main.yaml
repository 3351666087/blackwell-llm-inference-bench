# Pre-registered main test matrix (PREREGISTRATION.md §2).
# Run with:  python -m bib run plans/main.yaml [--servers id1,id2] [--workloads chat]
name: main
results_dir: results/main
request_sums: data/requests/SHA256SUMS
image_label: "AutoDL base image PyTorch 2.8.0 / Python 3.12 (ubuntu22.04) / CUDA 12.8"
# RTX PRO 6000 Blackwell *Server Edition*, official spec:
# https://www.nvidia.com/en-us/data-center/rtx-pro-6000-blackwell-server-edition/
gpu_bandwidth_gbps: 1597
port: 8000
reps: 3
max_client_procs: 6
streams_per_proc: 32
power_interval_s: 0.1
server_timeout_s: 3600

quality:
  file: data/requests/quality_gsm8k.jsonl.gz
  concurrency: 32

slo:
  chat:       {ttft_ms: 1000, tpot_ms: 50}
  prefill8k:  {ttft_ms: 2000, tpot_ms: 100}
  prefill16k: {ttft_ms: 4000, tpot_ms: 100}
  prefill32k: {ttft_ms: 8000, tpot_ms: 100}
  agent:      {ttft_ms: 1000, tpot_ms: 50}

workloads:
  - name: chat
    file: data/requests/chat.jsonl.gz
    warmup_file: data/requests/chat_warmup.jsonl.gz
    concurrency: [1, 4, 16, 32, 64, 128, 256, 512]
    requests: {per_conc: 8, min: 16, max: 2048}
    knee_min_conc: 64
    knee_gain: 0.05
  - name: prefill8k
    file: data/requests/prefill8k.jsonl.gz
    warmup_file: data/requests/prefill8k_warmup.jsonl.gz
    concurrency: [1, 2, 4, 8, 16, 32]
    requests: {per_conc: 4, min: 16, max: 96}
    knee_min_conc: 8
    knee_gain: 0.05
    warmup_min: 4
  - name: prefill16k
    file: data/requests/prefill16k.jsonl.gz
    warmup_file: data/requests/prefill16k_warmup.jsonl.gz
    concurrency: [1, 2, 4, 8, 16, 32]
    requests: {per_conc: 4, min: 16, max: 96}
    knee_min_conc: 8
    knee_gain: 0.05
    warmup_min: 4
  - name: prefill32k
    file: data/requests/prefill32k.jsonl.gz
    warmup_file: data/requests/prefill32k_warmup.jsonl.gz
    concurrency: [1, 2, 4, 8, 16, 32]
    requests: {per_conc: 4, min: 16, max: 96}
    knee_min_conc: 8
    knee_gain: 0.05
    warmup_min: 4
  - name: agent
    file: data/requests/agent.jsonl.gz
    warmup_file: data/requests/agent_warmup.jsonl.gz
    prefix_sensitive: true          # cache must be reset (or server restarted) between reps
    concurrency: [1, 4, 16, 32, 64, 128, 256]
    requests: {per_conc: 2, min: 8, max: 512}   # unit = sessions
    knee_min_conc: 32
    knee_gain: 0.05
    warmup_min: 8

# Server configs. Defaults of each framework except context length and the flags the
# experiment needs. Env paths are created by envs/<fw>/setup.sh.
servers:
  # ---------------- Qwen3-8B BF16
  - {id: vllm-q8b-bf16,   framework: vllm,   env: /root/envs/vllm,   model: /root/autodl-tmp/models/Qwen3-8B,     model_id: Qwen3-8B,  precision: bf16, max_model_len: 40960}
  - {id: sglang-q8b-bf16, framework: sglang, env: /root/envs/sglang, model: /root/autodl-tmp/models/Qwen3-8B,     model_id: Qwen3-8B,  precision: bf16, max_model_len: 40960}
  - {id: trtllm-q8b-bf16, framework: trtllm, env: /root/envs/trtllm, model: /root/autodl-tmp/models/Qwen3-8B,     model_id: Qwen3-8B,  precision: bf16, max_model_len: 40960}
  # ---------------- Qwen3-8B FP8 (official block-wise 128x128 FP8 checkpoint)
  - {id: vllm-q8b-fp8,    framework: vllm,   env: /root/envs/vllm,   model: /root/autodl-tmp/models/Qwen3-8B-FP8, model_id: Qwen3-8B,  precision: fp8,  max_model_len: 40960}
  - {id: sglang-q8b-fp8,  framework: sglang, env: /root/envs/sglang, model: /root/autodl-tmp/models/Qwen3-8B-FP8, model_id: Qwen3-8B,  precision: fp8,  max_model_len: 40960}
  - {id: trtllm-q8b-fp8,  framework: trtllm, env: /root/envs/trtllm, model: /root/autodl-tmp/models/Qwen3-8B-FP8, model_id: Qwen3-8B,  precision: fp8,  max_model_len: 40960}
  # ---------------- Qwen3-32B FP8 (prefill32k excluded to bound GPU time)
  - {id: vllm-q32b-fp8,   framework: vllm,   env: /root/envs/vllm,   model: /root/autodl-tmp/models/Qwen3-32B-FP8, model_id: Qwen3-32B, precision: fp8, max_model_len: 40960, skip_workloads: [prefill32k]}
  - {id: sglang-q32b-fp8, framework: sglang, env: /root/envs/sglang, model: /root/autodl-tmp/models/Qwen3-32B-FP8, model_id: Qwen3-32B, precision: fp8, max_model_len: 40960, skip_workloads: [prefill32k]}
  - {id: trtllm-q32b-fp8, framework: trtllm, env: /root/envs/trtllm, model: /root/autodl-tmp/models/Qwen3-32B-FP8, model_id: Qwen3-32B, precision: fp8, max_model_len: 40960, skip_workloads: [prefill32k]}
