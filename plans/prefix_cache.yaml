# Pre-registered prefix-cache study (task 4.5, PREREGISTRATION.md §6).
# Cache-ON results come from plans/main.yaml (agent workload, same server configs).
# This plan adds the cache-OFF runs on Qwen3-8B BF16 for every framework.
name: prefix_cache
results_dir: results/prefix_cache
request_sums: data/requests/SHA256SUMS
image_label: "AutoDL base image PyTorch 2.8.0 / Python 3.12 (ubuntu22.04) / CUDA 12.8"
gpu_bandwidth_gbps: 1597
port: 8000
reps: 3
max_client_procs: 6
streams_per_proc: 32
power_interval_s: 0.1
server_timeout_s: 3600
slo:
  agent: {ttft_ms: 1000, tpot_ms: 50}
workloads:
  - name: agent
    file: data/requests/agent.jsonl.gz
    warmup_file: data/requests/agent_warmup.jsonl.gz
    prefix_sensitive: false       # nothing to reset when the cache is disabled
    concurrency: [1, 4, 16, 32, 64, 128, 256]
    requests: {per_conc: 2, min: 8, max: 512}
    knee_min_conc: 32
    knee_gain: 0.05
    warmup_min: 8
servers:
  - {id: vllm-q8b-bf16-nocache,   framework: vllm,   env: /root/envs/vllm,   model: /root/autodl-tmp/models/Qwen3-8B, model_id: Qwen3-8B, precision: bf16, max_model_len: 40960, prefix_cache: false, quality: false, env_vars: {CUDA_HOME: /root/cuda13.0/nvidia/cu13}}
  - {id: sglang-q8b-bf16-nocache, framework: sglang, env: /root/envs/sglang, model: /root/autodl-tmp/models/Qwen3-8B, model_id: Qwen3-8B, precision: bf16, max_model_len: 40960, prefix_cache: false, quality: false, env_vars: {CUDA_HOME: /root/cuda13.0/nvidia/cu13}}
  - {id: trtllm-q8b-bf16-nocache, framework: trtllm, env: /root/envs/trtllm, model: /root/autodl-tmp/models/Qwen3-8B, model_id: Qwen3-8B, precision: bf16, max_model_len: 40960, prefix_cache: false, quality: false}
