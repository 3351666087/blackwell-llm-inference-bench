# Pre-registered regression-detection experiment (task 5.3).
# Same framework, two versions, identical configuration, run back-to-back on the
# same instance: vLLM 0.32.0 (base, env /root/envs/vllm-0.32.0) vs vLLM 0.33.0 (new).
# Fixed concurrency levels (no knee rule), 5 repetitions for more power.
# Result sets are compared offline with `python -m bib regress` (BH-FDR 5 %).
name: regression
results_dir: results/regression
request_sums: data/requests/SHA256SUMS
image_label: "AutoDL base image PyTorch 2.8.0 / Python 3.12 (ubuntu22.04) / CUDA 12.8"
gpu_bandwidth_gbps: 1597
port: 8000
reps: 5
max_client_procs: 6
streams_per_proc: 32
power_interval_s: 0.1
server_timeout_s: 3600
slo:
  chat:      {ttft_ms: 1000, tpot_ms: 50}
  prefill8k: {ttft_ms: 2000, tpot_ms: 100}
  agent:     {ttft_ms: 1000, tpot_ms: 50}
workloads:
  - name: chat
    file: data/requests/chat.jsonl.gz
    warmup_file: data/requests/chat_warmup.jsonl.gz
    concurrency: [1, 16, 64, 256]
    requests: {per_conc: 8, min: 16, max: 2048}
    knee_min_conc: 100000
  - name: prefill8k
    file: data/requests/prefill8k.jsonl.gz
    warmup_file: data/requests/prefill8k_warmup.jsonl.gz
    concurrency: [1, 8]
    requests: {per_conc: 4, min: 16, max: 96}
    knee_min_conc: 100000
    warmup_min: 4
  - name: agent
    file: data/requests/agent.jsonl.gz
    warmup_file: data/requests/agent_warmup.jsonl.gz
    prefix_sensitive: true
    concurrency: [16]
    requests: {per_conc: 2, min: 8, max: 512}
    knee_min_conc: 100000
    warmup_min: 8
servers:
  - {id: vllm0320-q8b-bf16, framework: vllm, env: /root/envs/vllm-0.32.0, model: /root/autodl-tmp/models/Qwen3-8B, model_id: Qwen3-8B, precision: bf16, max_model_len: 40960, quality: false, env_vars: {CUDA_HOME: /root/cuda13.0/nvidia/cu13}}
  - {id: vllm0330-q8b-bf16, framework: vllm, env: /root/envs/vllm,        model: /root/autodl-tmp/models/Qwen3-8B, model_id: Qwen3-8B, precision: bf16, max_model_len: 40960, quality: false, env_vars: {CUDA_HOME: /root/cuda13.0/nvidia/cu13}}
