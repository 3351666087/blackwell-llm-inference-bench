# Reproduction check (task 7.3): a representative subset of plans/main.yaml, written to its
# own results directory so that a fresh clone (which already contains results/main) re-measures
# instead of skipping finished repetitions. Same server config, request files and protocol as
# main; the knee rule is disabled so every listed level runs. Compare with:
#   python tools/repro_check.py results/main results/repro --server vllm-q8b-bf16
name: repro
results_dir: results/repro
request_sums: data/requests/SHA256SUMS
image_label: "AutoDL base image PyTorch 2.8.0 / Python 3.12 (ubuntu22.04) / CUDA 12.8"
gpu_bandwidth_gbps: 1597
port: 8000
reps: 3
max_client_procs: 6
streams_per_proc: 32
power_interval_s: 0.1
server_timeout_s: 3600
quality:
  file: data/requests/quality_gsm8k.jsonl.gz
  concurrency: 32
slo:
  chat:      {ttft_ms: 1000, tpot_ms: 50}
  prefill8k: {ttft_ms: 2000, tpot_ms: 100}
workloads:
  - name: chat
    file: data/requests/chat.jsonl.gz
    warmup_file: data/requests/chat_warmup.jsonl.gz
    concurrency: [1, 16, 64]
    requests: {per_conc: 8, min: 16, max: 2048}
    knee_min_conc: 100000
    knee_gain: 0.05
  - name: prefill8k
    file: data/requests/prefill8k.jsonl.gz
    warmup_file: data/requests/prefill8k_warmup.jsonl.gz
    concurrency: [1, 4]
    requests: {per_conc: 4, min: 16, max: 96}
    knee_min_conc: 100000
    knee_gain: 0.05
    warmup_min: 4
servers:
  - {id: vllm-q8b-bf16, framework: vllm, env: /root/envs/vllm, model: /root/autodl-tmp/models/Qwen3-8B, model_id: Qwen3-8B, precision: bf16, max_model_len: 40960, env_vars: {CUDA_HOME: /root/cuda13.0/nvidia/cu13}}
