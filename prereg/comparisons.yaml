# Machine-readable form of PREREGISTRATION.md §6. Evaluated by `python -m bib.compare`.
# Selector fields: plan, server (server config id), workload, conc (int or "peak").
# "peak" = the concurrency level with the highest median output throughput of that
# server config/workload; the per-rep values at that level are compared.
# ratio = A / B. `range` is the predicted interval for the ratio.
- id: P1
  title: "Decode efficiency at c=1 vs bandwidth floor (8B BF16)"
  type: vs_bandwidth_floor
  metric: tpot_p50_ms
  per_framework: [vllm, sglang, trtllm]
  a: {plan: main, server: "{fw}-q8b-bf16", workload: chat, conc: 1}
  range: [1.05, 1.25]
- id: P2
  title: "FP8 vs BF16 decode latency at c=1 (8B)"
