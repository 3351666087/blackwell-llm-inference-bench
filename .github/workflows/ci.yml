name: offline-checks
# CPU-only: unit tests, regression detection on committed results, secret scan.
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pyyaml aiohttp pytest
      - name: Unit tests (stats, regression detector, client vs mock server)
        run: python -m pytest -q tests/
      - name: Secret scan
        run: python tools/secret_scan.py
      - name: Regression report on committed results (vLLM 0.32.0 -> 0.33.0), if present
        run: |
          f=results/regression/summary/points.json
          if [ -f "$f" ]; then
            python -m bib.regress "$f" "$f" --base-server vllm0320-q8b-bf16 --new-server vllm0330-q8b-bf16 \
              --base-label "vLLM 0.32.0" --new-label "vLLM 0.33.0" --md regression_report.md
          else
            echo "no committed regression results yet"
          fi
