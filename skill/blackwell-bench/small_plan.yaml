# Small plan used to validate the skill in a fresh agent session (task 6.1).
# ~6 minutes of GPU time (+ ~20 min preparation on a fresh clone): one framework, one checkpoint,
# two workloads, 2 reps. Scratch results go to results/_skill_small (excluded from shared tables).
name: skill_validation
results_dir: results/_skill_small
request_sums: data/requests/SHA256SUMS
image_label: "AutoDL base image PyTorch 2.8.0 / Python 3.12 (ubuntu22.04) / CUDA 12.8"
gpu_bandwidth_gbps: 1597
port: 8000
reps: 2
max_client_procs: 4
streams_per_proc: 32
power_interval_s: 0.1
server_timeout_s: 3600
quality:
  file: data/requests/quality_gsm8k.jsonl.gz
  concurrency: 32
slo:
  chat:      {ttft_ms: 1000, tpot_ms: 50}
  prefill8k: {ttft_ms: 2000, tpot_ms: 100}
workloads:
  - name: chat
    file: data/requests/chat.jsonl.gz
    warmup_file: data/requests/chat_warmup.jsonl.gz
    concurrency: [1, 16, 64]
    requests: {per_conc: 8, min: 16, max: 512}
    knee_min_conc: 100000
  - name: prefill8k
    file: data/requests/prefill8k.jsonl.gz
    warmup_file: data/requests/prefill8k_warmup.jsonl.gz
    concurrency: [1, 4]
    requests: {per_conc: 4, min: 16, max: 96}
    knee_min_conc: 100000
    warmup_min: 4
servers:
  - {id: vllm-q8b-fp8, framework: vllm, env: /root/envs/vllm, model: /root/autodl-tmp/models/Qwen3-8B-FP8, model_id: Qwen3-8B, precision: fp8, max_model_len: 40960, env_vars: {CUDA_HOME: /root/cuda13.0/nvidia/cu13}}
models:   # fetched by the skill if missing: repo -> local dir
  Qwen/Qwen3-8B-FP8: /root/autodl-tmp/models/Qwen3-8B-FP8
